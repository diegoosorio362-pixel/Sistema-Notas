<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Sistema de Notas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h2>🧪 Test de Login - Sistema de Notas</h2>
    
    <form id="testForm">
        <div class="form-group">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit">Iniciar Sesión</button>
    </form>
    
    <div id="message"></div>
    
    <div style="margin-top: 30px; padding: 15px; background: #e9ecef; border-radius: 4px;">
        <h4>Credenciales de Prueba:</h4>
        <p><strong>Profesor:</strong> profesor / 123456</p>
        <p><strong>Administrador:</strong> admin / admin123</p>
    </div>

    <script>
        // Simulación simple del sistema de login
        const users = [
            { username: 'profesor', password: '123456', name: 'Profesor Principal', type: 'teacher' },
            { username: 'admin', password: 'admin123', name: 'Administrador', type: 'admin' }
        ];

        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                messageDiv.innerHTML = `
                    <div class="message success">
                        ✅ <strong>Login exitoso!</strong><br>
                        Usuario: ${user.name}<br>
                        Tipo: ${user.type === 'admin' ? 'Administrador' : 'Profesor'}<br>
                        <small>Redirigiendo al sistema principal...</small>
                    </div>
                `;
                
                // Simular redirección
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                messageDiv.innerHTML = `
                    <div class="message error">
                        ❌ <strong>Credenciales incorrectas</strong><br>
                        Verifica tu usuario y contraseña
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
