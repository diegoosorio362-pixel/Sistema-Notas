<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas - Versión Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 400px;
        }

        .login-form h1 {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .dashboard {
            display: none;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .welcome-text {
            color: rgba(255, 255, 255, 0.8);
        }

        .logout-btn {
            float: right;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-top: -10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .students-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .student-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-name {
            font-weight: 600;
        }

        .student-grades {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .message {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginSection" class="login-container">
        <form class="login-form" id="loginForm">
            <h1>🎓 Sistema de Notas</h1>
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
            <div id="loginMessage"></div>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="dashboard">
        <div class="container">
            <div class="header">
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
                <h1>📊 Panel de Control</h1>
                <p class="welcome-text">Bienvenido al sistema de gestión académica</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalStudents">24</div>
                    <div class="stat-label">👥 Estudiantes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="averageGrade">3.8</div>
                    <div class="stat-label">⭐ Promedio General</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalSubjects">5</div>
                    <div class="stat-label">📚 Materias</div>
                </div>
            </div>

            <div class="students-section">
                <h2>👥 Lista de Estudiantes</h2>
                <div id="studentsList">
                    <!-- Los estudiantes se cargarán aquí -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos hardcodeados
        const users = [
            { username: 'profesor', password: '123456', name: 'Profesor Principal' },
            { username: 'admin', password: 'admin123', name: 'Administrador' }
        ];

        const students = [
            { id: '1', name: 'BLANDON BELLO JHON DANIER', saber_n1: 2.9, saber_n2: 0.5, hacer_n3: 3.2, hacer_n4: 2.8, ser_n5: 4.1 },
            { id: '2', name: 'CARDENAS CASTAÑEDA HEIDY YICETH', saber_n1: 4.5, saber_n2: 4.2, hacer_n3: 3.8, hacer_n4: 4.0, ser_n5: 4.5 },
            { id: '3', name: 'CARDOZO SANTOFIMIO JOHAN JULIAN', saber_n1: 3.7, saber_n2: 3.5, hacer_n3: 3.2, hacer_n4: 3.4, ser_n5: 3.8 },
            { id: '4', name: 'CHAGUALA SANCHEZ BRAYAN ALEXIS', saber_n1: 4.2, saber_n2: 4.0, hacer_n3: 3.9, hacer_n4: 4.1, ser_n5: 4.3 },
            { id: '5', name: 'DIAZ FALLA MILHER DANIEL', saber_n1: 3.5, saber_n2: 3.3, hacer_n3: 3.6, hacer_n4: 3.4, ser_n5: 3.7 },
            { id: '6', name: 'GUEJIA TROCHEZ YIMER GILDARDO', saber_n1: 4.8, saber_n2: 4.6, hacer_n3: 4.5, hacer_n4: 4.7, ser_n5: 4.8 },
            { id: '7', name: 'HERRERA QUINTERO DANIA LIZETH', saber_n1: 3.2, saber_n2: 3.0, hacer_n3: 2.8, hacer_n4: 3.0, ser_n5: 3.3 },
            { id: '8', name: 'IMBACHY FIGUEROA TALIANA SOFIA', saber_n1: 4.0, saber_n2: 3.8, hacer_n3: 3.7, hacer_n4: 3.9, ser_n5: 4.1 },
            { id: '9', name: 'LOZANO GUZMAN ALAN SNEIDER', saber_n1: 3.8, saber_n2: 3.6, hacer_n3: 3.4, hacer_n4: 3.6, ser_n5: 3.9 },
            { id: '10', name: 'MORA MUÑOZ LUISA FERNANDA', saber_n1: 4.3, saber_n2: 4.1, hacer_n3: 4.0, hacer_n4: 4.2, ser_n5: 4.4 },
            { id: '11', name: 'MORA VASQUEZ GISSELL VALENTINA', saber_n1: 3.6, saber_n2: 3.4, hacer_n3: 3.3, hacer_n4: 3.5, ser_n5: 3.7 },
            { id: '12', name: 'MUÑOZ CALDERON MAIDY EMERAY', saber_n1: 4.1, saber_n2: 3.9, hacer_n3: 3.8, hacer_n4: 4.0, ser_n5: 4.2 },
            { id: '13', name: 'ORTIZ CABEZAS MAUREN DAYANA', saber_n1: 4.2, saber_n2: 3.8, hacer_n3: 3.9, hacer_n4: 4.1, ser_n5: 4.3 },
            { id: '14', name: 'PERDOMO MARTOS MAIDY XIOMARA', saber_n1: 3.9, saber_n2: 3.7, hacer_n3: 3.5, hacer_n4: 3.7, ser_n5: 4.0 },
            { id: '15', name: 'PEREZ MUÑOZ YEIMY TALIANA', saber_n1: 4.4, saber_n2: 4.2, hacer_n3: 4.1, hacer_n4: 4.3, ser_n5: 4.5 },
            { id: '16', name: 'PINEDA ROJAS JHON MARIO', saber_n1: 3.4, saber_n2: 3.2, hacer_n3: 3.1, hacer_n4: 3.3, ser_n5: 3.5 },
            { id: '17', name: 'RODRIGUEZ CORTEZ NORA LISETH', saber_n1: 4.6, saber_n2: 4.4, hacer_n3: 4.3, hacer_n4: 4.5, ser_n5: 4.7 },
            { id: '18', name: 'TAPIA INVACHY YADY MIRLEY', saber_n1: 3.1, saber_n2: 2.9, hacer_n3: 2.7, hacer_n4: 2.9, ser_n5: 3.2 },
            { id: '19', name: 'VALENCIA VALENCIA DARLY DAYANA', saber_n1: 4.7, saber_n2: 4.5, hacer_n3: 4.4, hacer_n4: 4.6, ser_n5: 4.8 },
            { id: '20', name: 'VARGAS ROJAS YANK SEBASTIAN', saber_n1: 3.3, saber_n2: 3.1, hacer_n3: 2.9, hacer_n4: 3.1, ser_n5: 3.4 },
            { id: '21', name: 'VARGAS SOGAMOSO NATALIA', saber_n1: 4.2, saber_n2: 4.0, hacer_n3: 3.9, hacer_n4: 4.1, ser_n5: 4.3 },
            { id: '22', name: 'VASQUEZ RAMIREZ JHONY ALEXANDER', saber_n1: 3.7, saber_n2: 3.5, hacer_n3: 3.4, hacer_n4: 3.6, ser_n5: 3.8 },
            { id: '23', name: 'VILLAREAL ALEJANDRO FABIELY', saber_n1: 4.5, saber_n2: 4.3, hacer_n3: 4.2, hacer_n4: 4.4, ser_n5: 4.6 },
            { id: '24', name: 'YAIMA BELTRAN ANDRES FABIAN', saber_n1: 3.8, saber_n2: 3.6, hacer_n3: 3.5, hacer_n4: 3.7, ser_n5: 3.9 }
        ];

        // Variables globales
        let currentUser = null;

        // Función de login
        function login(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('loginMessage');
            
            // Limpiar mensajes previos
            messageDiv.innerHTML = '';
            
            // Validar credenciales
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                currentUser = user;
                showMessage('Login exitoso', 'success');
                
                // Mostrar dashboard después de un breve delay
                setTimeout(() => {
                    showDashboard();
                }, 1000);
            } else {
                showMessage('Credenciales incorrectas', 'error');
            }
        }

        // Función para mostrar mensajes
        function showMessage(text, type) {
            const messageDiv = document.getElementById('loginMessage');
            messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        // Función para mostrar el dashboard
        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadStudents();
        }

        // Función para cerrar sesión
        function logout() {
            currentUser = null;
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginForm').reset();
            document.getElementById('loginMessage').innerHTML = '';
        }

        // Función para cargar estudiantes
        function loadStudents() {
            const studentsList = document.getElementById('studentsList');
            let html = '';
            
            students.forEach(student => {
                const avgGrade = ((student.saber_n1 + student.saber_n2 + student.hacer_n3 + student.hacer_n4 + student.ser_n5) / 5).toFixed(1);
                
                html += `
                    <div class="student-item">
                        <div class="student-name">${student.name}</div>
                        <div class="student-grades">
                            <span>Saber: ${student.saber_n1}</span>
                            <span>Hacer: ${student.hacer_n3}</span>
                            <span>Ser: ${student.ser_n5}</span>
                            <span><strong>Promedio: ${avgGrade}</strong></span>
                        </div>
                    </div>
                `;
            });
            
            studentsList.innerHTML = html;
        }

        // Event listener para el formulario de login
        document.getElementById('loginForm').addEventListener('submit', login);

        // Mostrar credenciales en consola para facilitar las pruebas
        console.log('=== CREDENCIALES DE ACCESO ===');
        console.log('Profesor: usuario="profesor", contraseña="123456"');
        console.log('Admin: usuario="admin", contraseña="admin123"');
    </script>
</body>
</html>
